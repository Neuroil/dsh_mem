# Bundle patch for dsh-mem (installed via `dsh plugin add <this package>`).
# Overlays replace a whole entry config by id — restate the full `config`
# when overriding any key here.
- id: dsh-mem
  name: dsh-mem
  config:
    storage:
      backend: json
    embedding:
      mode: http
      endpoint: https://api.siliconflow.cn/v1/embeddings
      model: BAAI/bge-m3
      apiKey: !!js process.env.MEM_EMBEDDING_API_KEY ?? ''
    reranker:
      mode: http
      endpoint: https://api.siliconflow.cn/v1/rerank
      model: BAAI/bge-reranker-v2-m3
      apiKey: !!js process.env.MEM_RERANKER_API_KEY ?? ''
    llm:
      # 必须是宿主 ctx.llm 已注册的路由名：dsh-llm-deepseek 注册为 deepseek-official，
      # 模型目录 deepseek-v4-flash / deepseek-v4-pro。schema 默认值 deepseek/deepseek-chat 不在注册表。
      provider: deepseek-official
      model: deepseek-v4-flash
